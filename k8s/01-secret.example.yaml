# ---------------------------------------------------------------------------
# broskie-secrets — TEMPLATE ONLY (entirely comments, safe to skip).
# ---------------------------------------------------------------------------
#
# Credentials are created with `kubectl create secret` so real values never
# land in git. This file is intentionally all-comments: `kubectl apply -f k8s/`
# is a no-op for it, which keeps `kubectl apply -f k8s/` safe to run even
# before the secret exists (the Deployment marks VAPID_* optional, and you
# create the secret before applying 02-deployment.yaml — see K8S.md §3).
#
# Create it (recommended):
#
#   kubectl create secret generic broskie-secrets -n broskie \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=VAPID_PUBLIC_KEY='' \
#     --from-literal=VAPID_PRIVATE_KEY='' \
#     --from-literal=VAPID_SUBJECT='mailto:you@example.com'
#
# JWT_SECRET        REQUIRED. Strong random string (openssl rand -hex 32).
# VAPID_*           OPTIONAL. Leave empty to auto-generate a keypair once and
#                   persist it on the /data volume (server/src/push.js). If you
#                   do set them, generate with: npx web-push generate-vapid-keys
#
# Equivalent YAML shape (for reference — do NOT commit real values):
#
#   apiVersion: v1
#   kind: Secret
#   metadata:
#     name: broskie-secrets
#     namespace: broskie
#   type: Opaque
#   stringData:
#     JWT_SECRET: "REPLACE_ME"
#     VAPID_PUBLIC_KEY: ""
#     VAPID_PRIVATE_KEY: ""
#     VAPID_SUBJECT: "mailto:you@example.com"
