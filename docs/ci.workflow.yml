name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server — syntax + all test suites
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Syntax check every source file
        run: for f in src/*.js test-*.js; do node --check "$f"; done
      - name: DATA_DIR / Railway SQLITE_READONLY suite
        run: node test-data-dir.js
      - name: Push notifications suite (33 checks)
        run: node test-push.js
      - name: Forgot password and OTP suite
        run: node test-forgot-password-otp.js
      - name: Phase 2 campus loop suite (39 checks)
        run: node test-phase2.js
      - name: Phase 3 suite (invite links, grouped activity, web push)
        run: node test-phase3.js
      - name: Chat history suite (14 checks)
        run: node test-chat-history.js
      - name: Offline messaging suite (14 checks)
        run: node test-offline-messaging.js
      - name: Local message-state suite (15 checks)
        run: node test-message-state.js
      - name: Moderation & safety suite (61 checks)
        run: node test-moderation.js
      - name: Operational Transformation suite (33 checks, incl. client⇄server parity)
        run: node test-ot.js
      - name: Feature suite (27 checks — boot + realtime flows)
        run: node test-features.js

  app:
    name: App — bundle checks (web + android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Web bundle export
        run: CI=true npx expo export --platform web --output-dir /tmp/web-export
      - name: Android (Hermes) bundle export
        run: CI=true npx expo export --platform android --output-dir /tmp/android-export
