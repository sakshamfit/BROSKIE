services:
  - type: web
    name: tomodachi
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "20"
    # Persist the SQLite database across deploys (paid plans only).
