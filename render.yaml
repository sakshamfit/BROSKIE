# Backend only; deploy the Expo/web frontend separately.
services:
  - type: web
    name: tomodachi
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://plusoneco.in,https://www.plusoneco.in
      - key: DATA_DIR
        value: /var/data
    # Free-tier storage is ephemeral: SQLite, uploads and backups are lost
    # on redeploy/restart. For real accounts, change plan to starter and
    # uncomment this disk before storing data you need to keep.
    # disk:
    #   name: tomodachi-data
    #   mountPath: /var/data
    #   sizeGB: 1
