<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!--
      Real-app viewport rules:
      - maximum-scale=1 + user-scalable=no  → no pinch zoom, no iOS input auto-zoom
      - viewport-fit=cover                   → iPhone notch/Dynamic Island safe area
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <!-- Mobile browser chrome (URL bar / status bar) matches the paper bg;
         kept in sync with dark mode at runtime by App.js -->
    <meta name="theme-color" content="#fdf8f8" />
    <!-- PWA: installable, standalone (no browser chrome), app-like launch -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS: add-to-home-screen standalone; status bar text stays readable
         (black on the paper bg) while the app draws under it via
         viewport-fit=cover + safe-area insets. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="+one" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      /* Full-height app shell — the page is never white behind the UI */
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        /* Warm pulp paper — matches lightTheme.bg; dark mode syncs at runtime */
        background-color: #fdf8f8;
        /* No rubber-band / pull-to-refresh flash of background when scrolling */
        overscroll-behavior: none;
        overflow-x: hidden;
      }
      body {
        overflow: hidden;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        /* Pan/scroll allowed, but double-tap zoom is disabled */
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        width: 100%;
        flex: 1;
      }
      /* Mobile browsers: use the *dynamic* viewport height so the address bar
         collapsing/expanding never leaves a strip of background below the app. */
      @supports (height: 100dvh) {
        html,
        body,
        #root {
          height: 100dvh;
        }
      }
      /* Ink-style text selection */
      ::selection {
        background: #ffe24d;
        color: #1c1b1b;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- The root element for your Expo app. -->
    <div id="root">
      <!--
        Static boot shell — the branded first paint before the JS bundle
        arrives. Mirrors the in-app <Loading label="LOADING +ONE"> state
        (paper bg, ink arc spinner, mono label). React 19's createRoot()
        replaces the container's children on first render, so the app simply
        takes over from this; nothing needs to remove it by hand. Bots and
        no-JS visitors see a branded page instead of a blank one.
      -->
      <div id="static-boot" role="status" aria-label="Loading +one" style="display:flex;flex:1;height:100%;align-items:center;justify-content:center;background-color:#fdf8f8;gap:14px;flex-direction:column;">
        <style>
          #static-boot .boot-arc {
            animation: boot-spin 0.9s linear infinite;
          }
          @keyframes boot-spin {
            to { transform: rotate(360deg); }
          }
          @media (prefers-reduced-motion: reduce) {
            #static-boot .boot-arc { animation: none; }
          }
        </style>
        <svg class="boot-arc" width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" fill="none" r="14" stroke-width="4" style="stroke:#000000;opacity:0.2"></circle>
          <circle cx="16" cy="16" fill="none" r="14" stroke-width="4" style="stroke:#000000;stroke-dasharray:80;stroke-dashoffset:60"></circle>
        </svg>
        <div style="font-family:JetBrainsMono,'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;line-height:13px;letter-spacing:0.55px;color:#747878;">LOADING +ONE</div>
      </div>
    </div>
  </body>
</html>
